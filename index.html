// ============================================================
// 화면 설정: 논리 해상도를 화면에 비율 맞춰 표시 (PRD 9항)
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let scale = 1;   // 논리 px → CSS px 배율

function resize() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  scale = Math.min(vw / CONFIG.WIDTH, vh / CONFIG.HEIGHT);

  const cssW = Math.floor(CONFIG.WIDTH * scale);
  const cssH = Math.floor(CONFIG.HEIGHT * scale);
  const dpr = window.devicePixelRatio || 1;

  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.floor(cssW * dpr);    // 고해상도 화면에서도 선명하게
  canvas.height = Math.floor(cssH * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.visualViewport?.addEventListener('resize', resize);  // 모바일 주소창 변화 대응
resize();

// ============================================================
// Input: 터치·마우스·키보드 입력 (PRD 5항)
// ============================================================
const Input = {
  keys: { left: false, right: false },
  pointerId: null,     // 현재 추적 중인 손가락(또는 마우스)
  startX: 0,
  pointerX: 0,
  dragging: false,     // true면 드래그, false면 누르고 있기(탭 이동)

  // 화면 좌표를 논리 좌표(x)로 변환
  toLogicalX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) / scale;
  },
  toLogicalY(clientY) {
    const rect = canvas.getBoundingClientRect();
    return (clientY - rect.top) / scale;
  },

  // 눌린 키와 손가락을 모두 해제 (화면 전환·창 이동 시)
  reset() {
    this.keys.left = this.keys.right = false;
    this.pointerId = null;
    this.dragging = false;
  },

  // -1(왼쪽), 0(정지), 1(오른쪽): 키보드 또는 탭 이동 방향
  holdDirection() {
    if (this.pointerId !== null && !this.dragging) {
      return this.pointerX < CONFIG.WIDTH / 2 ? -1 : 1;
    }
    return (this.keys.right ? 1 : 0) - (this.keys.left ? 1 : 0);
  },

  init() {
    canvas.addEventListener('pointerdown', (e) => {
      Sound.unlock();                        // 브라우저 정책: 첫 터치 뒤에만 소리가 난다
      if (this.pointerId !== null) return;   // 첫 번째 손가락만 사용
      const x = this.toLogicalX(e.clientX);
      const y = this.toLogicalY(e.clientY);
      if (UI.press(x, y)) return;            // 버튼을 눌렀으면 이동 입력으로 쓰지 않음
      if (!canMove()) return;
      this.pointerId = e.pointerId;
      this.startX = this.pointerX = x;
      this.dragging = false;
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (e.pointerId !== this.pointerId) return;
      this.pointerX = this.toLogicalX(e.clientX);
      if (Math.abs(this.pointerX - this.startX) > CONFIG.DRAG_THRESHOLD) {
        this.dragging = true;   // 드래그가 탭보다 우선 (PRD 5항)
      }
    });
    const release = (e) => {
      if (e.pointerId !== this.pointerId) return;
      this.pointerId = null;
      this.dragging = false;
    };
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);

    const setKey = (e, pressed) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') this.keys.left = pressed;
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.keys.right = pressed;
      else return;
      e.preventDefault();
    };
    window.addEventListener('keydown', (e) => {
      Sound.unlock();
      if (UI.key(e.key)) { e.preventDefault(); return; }   // 화면 전환 키 (엔터·스페이스·Esc·P)
      setKey(e, true);
    });
    window.addEventListener('keyup', (e) => setKey(e, false));

    // 다른 창으로 이동하면 눌린 키를 모두 해제 (키가 눌린 채로 남는 문제 방지)
    window.addEventListener('blur', () => this.reset());
    // iOS Safari는 손을 뗄 때(touchend)에만 소리를 허용하는 경우가 있다
    window.addEventListener('touchend', () => Sound.unlock());
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  },
};
Input.init();

const CATCH_LIFT = 3;
const PLAYER_CATCH_BODY = (() => {
  const isArm = (x) => x <= 8 || x >= 19;   // 머리(9~18칸) 바깥은 글러브·팔
  const armRow = PLAYER_BODY[9];            // 팔만 있는 줄
  const top = [];
  for (let y = 0; y < 12 + CATCH_LIFT; y++) {
    let row = '';
    for (let x = 0; x < armRow.length; x++) {
      if (isArm(x)) row += y < 9 ? PLAYER_BODY[y][x] : armRow[x];
      else row += y < CATCH_LIFT ? '.' : PLAYER_BODY[y - CATCH_LIFT][x];
    }
    top.push(row);
  }
  return [...top, ...PLAYER_BODY.slice(12)];
})();

];

  row.replace(/[RW]/g, 'h').replace(/r/g, 'i')
);

// 글자 배열을 1칸 = 1px 캔버스로 미리 그려 둔다 (매 프레임 다시 그리지 않음)
function makeSprite(rows, mirror = false) {
  const w = rows[0].length;
  const h = rows.length;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  rows.forEach((row, y) => {
    if (row.length !== w) console.warn(`도트 그림 ${y}번째 줄 길이가 다릅니다: ${row.length}`);
    for (let x = 0; x < w; x++) {
      const color = PALETTE[row[x]];
      if (!color) continue;
      g.fillStyle = color;
      g.fillRect(mirror ? w - 1 - x : x, y, 1, 1);
    }
  });
  return c;
}

const Assets = {
  sprites: {
    playerStand: makeSprite([...PLAYER_BODY, ...LEGS_STAND]),
    playerStepL: makeSprite([...PLAYER_BODY, ...LEGS_STEP]),
    playerStepR: makeSprite([...PLAYER_BODY, ...LEGS_STEP], true),
    playerCatch: makeSprite([...PLAYER_CATCH_BODY, ...LEGS_STAND]),
    heart: makeSprite(HEART_ART),
    heartEmpty: makeSprite(HEART_EMPTY_ART),
    // 아이템 그림: ITEM_ART의 이름(id) 그대로 사용
    ...Object.fromEntries(
      Object.entries(ITEM_ART).map(([id, rows]) => [id, makeSprite(rows)])
    ),
  },

  // 도트 그림을 PIXEL배로 키워 그린다. 위치를 도트 격자에 맞춰 반쯤 걸친 도트가 없게 한다.
  draw(sprite, x, y) {
    const p = CONFIG.PIXEL;
    ctx.drawImage(sprite,
      Math.round(x / p) * p, Math.round(y / p) * p,
      sprite.width * p, sprite.height * p);
  },

  // 캐릭터 발밑 그림자 (도트 계단 모양 타원)
  drawShadow(cx, footY, widthDots) {
    const p = CONFIG.PIXEL;
    const x = Math.round(cx / p) * p;
    const y = Math.round(footY / p) * p;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fillRect(x - (widthDots / 2 - 2) * p, y - p, (widthDots - 4) * p, p);
    ctx.fillRect(x - (widthDots / 2) * p, y, widthDots * p, p);
    ctx.fillRect(x - (widthDots / 2 - 2) * p, y + p, (widthDots - 4) * p, p);
  },
};

// 배경: 도트 링 매트를 한 번만 그려 두고 매 프레임 붙여 넣는다
// ============================================================
const background = (() => {
  const p = CONFIG.PIXEL;
  const w = CONFIG.WIDTH / p;     // 180칸
  const h = CONFIG.HEIGHT / p;    // 320칸
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  const col = CONFIG.COLORS;

  // 매트 바탕과 잔잔한 점무늬
  g.fillStyle = col.mat;
  g.fillRect(0, 0, w, h);
  g.fillStyle = col.matDot;
  for (let y = 0; y < h; y += 4) {
    for (let x = (y / 4) % 2 === 0 ? 0 : 2; x < w; x += 4) g.fillRect(x, y, 1, 1);
  }

  // 매트 이음선
  g.fillStyle = col.matLine;
  for (let y = 60; y < h; y += 50) g.fillRect(0, y, w, 1);

  // 링 로프 3줄 (밝은 줄 · 기본 · 어두운 줄로 입체감)
  for (let i = 0; i < 3; i++) {
    const y = 12 + i * 8;
    g.fillStyle = col.ropeLight; g.fillRect(0, y, w, 1);
    g.fillStyle = col.rope;      g.fillRect(0, y + 1, w, 1);
    g.fillStyle = col.ropeDark;  g.fillRect(0, y + 2, w, 1);
  }

  // 양쪽 코너 기둥
  for (const x of [2, w - 6]) {
    g.fillStyle = col.postDark; g.fillRect(x, 6, 4, 34);
    g.fillStyle = col.post;     g.fillRect(x, 6, 3, 34);
    g.fillStyle = col.textShadow;
    g.fillRect(x - 1, 5, 6, 1);
    g.fillRect(x - 1, 40, 6, 1);
  }

  // 캐릭터가 서는 링 바닥 가장자리
  const floorY = Math.round((CONFIG.HEIGHT - CONFIG.PLAYER_BOTTOM_MARGIN) / p) + 6;
  g.fillStyle = col.text;
  g.fillRect(0, floorY, w, 1);
  g.fillStyle = col.matLine;
  g.fillRect(0, floorY + 1, w, h - floorY - 1);
  return c;
})();

// Game: 상태와 갱신
// ============================================================
const player = {
  x: CONFIG.WIDTH / 2,                                  // 발 가운데 x
  y: CONFIG.HEIGHT - CONFIG.PLAYER_BOTTOM_MARGIN,       // 발 위치 y
  w: Assets.sprites.playerStand.width * CONFIG.PIXEL,
  h: Assets.sprites.playerStand.height * CONFIG.PIXEL,
  moving: false,
  walkTime: 0,                                          // 걷기 그림 전환용 누적 시간
};

function updatePlayer(dt) {
  const prevX = player.x;

  if (Input.pointerId !== null && Input.dragging) {
    // 드래그: 손가락 x를 부드럽게 따라감
    const t = Math.min(1, dt * CONFIG.DRAG_FOLLOW);
    player.x += (Input.pointerX - player.x) * t;
  } else {
    // 키보드·탭: 일정 속도로 이동
    player.x += Input.holdDirection() * CONFIG.WIDTH * CONFIG.PLAYER_SPEED_RATIO * dt;
  }

  // 화면 밖으로 나가지 않게 제한
  const half = player.w / 2;
  player.x = Math.max(half, Math.min(CONFIG.WIDTH - half, player.x));

  // 도트 반 칸 이상 움직였으면 걷는 중으로 판단
  player.moving = Math.abs(player.x - prevX) > CONFIG.PIXEL / 2;
  player.walkTime = player.moving ? player.walkTime + dt : 0;
}

// ------------------------------------------------------------
// 아이템 생성·낙하·충돌 (PRD 4-3~4-5항, 7항 F2·F3)
// ------------------------------------------------------------
const items = [];          // 화면에 떨어지고 있는 아이템
let spawnTimer = 0;        // 다음 생성까지 남은 시간(초)
let lastSpawnX = null;     // 직전에 생성한 아이템의 x (겹침 방지)
let level = CONFIG.LEVELS[0];

// ------------------------------------------------------------
// 점수·하트·타이머 (PRD 4-1·4-2·4-6항, 7항 F4)
// ------------------------------------------------------------
const game = {
  score: 0,
  hearts: CONFIG.START_HEARTS,
  timeLeft: CONFIG.GAME_TIME,
  invincible: 0,       // 남은 무적 시간(초)
  over: false,
  endReason: '',       // 'time' 또는 'hearts'
  caught: {},          // 아이템별 받은 개수 { jumpRope: 3, ... }
  newRecord: false,    // 이번 판에서 최고 점수를 갱신했는지
  levelIndex: 0,       // 현재 난이도 단계 (0부터)
  levelUpTimer: 0,     // LEVEL UP! 표시 남은 시간(초)
};

// ------------------------------------------------------------
// 화면 전환 (PRD 3항, 6항, 7항 F6)
// title → countdown → play ⇄ paused → result → countdown(다시 하기) 또는 title(처음으로)
// ------------------------------------------------------------
const Screen = {
  state: 'title',
  time: 0,             // 현재 화면에 들어온 뒤 지난 시간(초)
  playTime: 0,         // 플레이를 시작한 뒤 지난 시간(초, 일시정지 제외)
};

function setScreen(state) {
  Screen.state = state;
  Screen.time = 0;
  // 메뉴 화면으로 바뀌면 누르고 있던 입력을 놓은 것으로 처리
  // (카운트다운 → 플레이는 드래그를 이어서 할 수 있게 유지)
  if (!canMove()) Input.reset();
}

// 캐릭터를 움직일 수 있는 화면 (카운트다운 중에도 미리 자리를 잡을 수 있다)
function canMove() {
  return Screen.state === 'play' || Screen.state === 'countdown';
}

function resetGame() {
  game.score = 0;
  game.hearts = CONFIG.START_HEARTS;
  game.timeLeft = CONFIG.GAME_TIME;
  game.invincible = 0;
  game.over = false;
  game.endReason = '';
  game.caught = {};
  game.newRecord = false;
  Share.reset();
  game.levelIndex = 0;
  game.levelUpTimer = 0;
  Effects.reset();
  level = CONFIG.LEVELS[0];
  items.length = 0;
  spawnTimer = 0;
  lastSpawnX = null;
  player.x = CONFIG.WIDTH / 2;
  player.moving = false;
  player.walkTime = 0;
  Screen.playTime = 0;
}

function startGame() {
  resetGame();
  Sound.restartBgm();
  setScreen('countdown');
}

function goTitle() {
  resetGame();
  setScreen('title');
}

function pauseGame() {
  if (Screen.state === 'play') setScreen('paused');
}

function resumeGame() {
  if (Screen.state === 'paused') setScreen('play');
}

function endGame(reason) {
  game.over = true;
  game.endReason = reason;
  player.moving = false;
  game.newRecord = Record.submit(game.score);
  Share.prepare();   // 공유 버튼을 누르는 순간 바로 공유 창을 열 수 있게 이미지를 미리 만든다
  setScreen('result');
  Sound.play('end', reason);
}

// 받은 아이템 처리. 정크푸드는 무적 시간에는 영향이 없다.
// 반환값: 아이템을 화면에서 지울지 여부
function catchItem(def) {
  if (def.type === 'bad') {
    if (game.invincible > 0) return false;   // 무적 중에는 그대로 통과
    game.hearts--;
    game.invincible = CONFIG.INVINCIBLE_TIME;
    if (game.hearts <= 0) endGame('hearts');
  } else {
    game.score += def.score;
  }
  game.caught[def.id] = (game.caught[def.id] || 0) + 1;
  return true;
}

function updateTimer(dt) {
  game.invincible = Math.max(0, game.invincible - dt);
  game.timeLeft = Math.max(0, game.timeLeft - dt);
  if (game.timeLeft <= 0) endGame('time');
}

// 지난 시간에 따라 난이도 단계를 올린다 (PRD 4-5항, 7항 F5)
function updateLevel(dt) {
  game.levelUpTimer = Math.max(0, game.levelUpTimer - dt);
  const elapsed = CONFIG.GAME_TIME - game.timeLeft;
  const index = Math.min(Math.floor(elapsed / CONFIG.LEVEL_DURATION), CONFIG.LEVELS.length - 1);
  if (index > game.levelIndex) {
    game.levelIndex = index;
    level = CONFIG.LEVELS[index];
    game.levelUpTimer = CONFIG.LEVEL_UP_TIME;
    Sound.play('levelUp');
  }
}

// weight 비율에 따라 하나를 무작위로 고른다
function pickWeighted(list) {
  const total = list.reduce((sum, it) => sum + it.weight, 0);
  let r = Math.random() * total;
  for (const it of list) {
    r -= it.weight;
    if (r < 0) return it;
  }
  return list[list.length - 1];
}

function spawnItem() {
  const type = Math.random() < level.badRatio ? 'bad' : 'good';
  const def = pickWeighted(CONFIG.ITEMS.filter((it) => it.type === type));
  const sprite = Assets.sprites[def.id];
  const w = sprite.width * CONFIG.PIXEL;
  const h = sprite.height * CONFIG.PIXEL;

  // 직전 아이템과 너무 가깝지 않은 x를 고른다 (몇 번 시도 후 포기)
  let x;
  for (let i = 0; i < 5; i++) {
    x = w / 2 + Math.random() * (CONFIG.WIDTH - w);
    if (lastSpawnX === null || Math.abs(x - lastSpawnX) >= CONFIG.SPAWN_MIN_GAP) break;
  }
  lastSpawnX = x;

  items.push({
    def,
    x,                 // 가운데 x
    y: -h,             // 위쪽 y (화면 위에서 시작)
    w,
    h,
    speed: level.fallSpeed * CONFIG.HEIGHT * def.speed,   // 초당 논리 px
  });
}

// 가운데 기준으로 줄인 충돌 상자
function hitbox(cx, top, w, h) {
  const r = CONFIG.HITBOX_RATIO;
  return {
    left: cx - (w * r) / 2,
    right: cx + (w * r) / 2,
    top: top + (h * (1 - r)) / 2,
    bottom: top + h - (h * (1 - r)) / 2,
  };
}

function overlaps(a, b) {
  return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
}

function updateItems(dt) {
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnItem();
    spawnTimer += level.spawnInterval;
  }

  const playerBox = hitbox(player.x, player.y - player.h, player.w, player.h);

  // 배열에서 지우면서 돌기 때문에 뒤에서부터 순회
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.speed * dt;

    if (overlaps(playerBox, hitbox(it.x, it.y, it.w, it.h))) {
      if (catchItem(it.def)) {
        Effects.onCatch(it);
        if (it.def.type === 'good') Sound.play('catch', it.def.score);
        else Sound.play('hit');
        items.splice(i, 1);
      }
      if (game.over) return;            // 마지막 하트를 잃으면 바로 멈춤
    } else if (it.y > CONFIG.HEIGHT) {
      items.splice(i, 1);               // 놓친 아이템은 하트·점수 변화 없음 (PRD 4-3항)
    }
  }
}

// ------------------------------------------------------------
// 연출: 점수 팝업, 도트 파편, 화면 흔들림, 하트 깨짐 (PRD 8-3항)
// 플레이 중에만 시간이 흐르므로 일시정지하면 연출도 멈춘다.
// ------------------------------------------------------------
const Effects = {
  popups: [],          // { text, color, x, y, time }
  particles: [],       // { x, y, vx, vy, color, time }
  shake: 0,            // 남은 흔들림 시간(초)
  flash: 0,            // 남은 빨간 번쩍임 시간(초)
  pose: 0,             // 남은 두 팔 든 자세 시간(초)
  heartBreak: 0,       // 남은 하트 깨짐 시간(초)
  heartIndex: -1,      // 깨지는 하트의 위치

  reset() {
    this.popups.length = 0;
    this.particles.length = 0;
    this.shake = this.flash = this.pose = this.heartBreak = 0;
    this.heartIndex = -1;
  },

  // 아이템을 받은 순간 (catchItem이 처리한 경우에만 호출)
  onCatch(it) {
    const col = CONFIG.COLORS;
    const good = it.def.type === 'good';
    // 글자가 화면 밖으로 잘리지 않게 x를 안쪽으로 제한
    const x = Math.max(80, Math.min(CONFIG.WIDTH - 80, it.x));
    this.popups.push({
      text: good ? `+${it.def.score}` : '하트 -1',
      color: good ? col.accent : col.warning,
      x,
      y: it.y,
      time: 0,
    });
    const colors = good ? [col.accent, col.text] : [col.warning, PALETTE.G];
    for (let i = 0; i < CONFIG.PARTICLE_COUNT; i++) {
      const angle = Math.PI * (1 + i / (CONFIG.PARTICLE_COUNT - 1));   // 위쪽 반원으로 퍼짐
      const speed = 220 + Math.random() * 160;
      this.particles.push({
        x: it.x,
        y: it.y + it.h / 2,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color: colors[i % colors.length],
        time: 0,
      });
    }
    if (good) {
      this.pose = CONFIG.CATCH_POSE_TIME;
    } else {
      this.shake = CONFIG.SHAKE_TIME;
      this.flash = CONFIG.HIT_FLASH_TIME;
      this.heartBreak = CONFIG.HEART_BREAK_TIME;
      this.heartIndex = game.hearts;   // 방금 잃은 하트 (hearts는 이미 줄어든 값)
    }
  },

  update(dt) {
    this.shake = Math.max(0, this.shake - dt);
    this.flash = Math.max(0, this.flash - dt);
    this.pose = Math.max(0, this.pose - dt);
    this.heartBreak = Math.max(0, this.heartBreak - dt);

    for (let i = this.popups.length - 1; i >= 0; i--) {
      const pop = this.popups[i];
      pop.time += dt;
      if (pop.time >= CONFIG.POPUP_TIME) this.popups.splice(i, 1);
    }
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.time += dt;
      pt.vy += 900 * dt;                 // 중력
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      if (pt.time >= CONFIG.PARTICLE_TIME) this.particles.splice(i, 1);
    }
  },

  // 흔들림 오프셋: 점점 약해지고, 도트 격자에 맞춘다
  shakeOffset() {
    if (this.shake <= 0) return { x: 0, y: 0 };
    const p = CONFIG.PIXEL;
    const power = CONFIG.SHAKE_POWER * (this.shake / CONFIG.SHAKE_TIME);
    const snap = (v) => Math.round(v / p) * p;
    return {
      x: snap((Math.random() * 2 - 1) * power),
      y: snap((Math.random() * 2 - 1) * power),
    };
  },
};

// ============================================================
// Sound: 효과음·배경음악 (PRD 7-2항)
// 음원 파일 없이 Web Audio로 소리를 직접 만든다. 나중에 mp3로 바꿀 때는
// SFX의 함수만 "버퍼를 재생"하도록 바꾸면 된다.
// ============================================================
const Sound = {
  ctx: null,           // AudioContext (첫 터치 뒤에 만든다)
  master: null,        // 전체 음량 (소리 끄기는 여기서 0으로)
  sfxBus: null,
  bgmBus: null,
  noiseBuffer: null,   // 타악기용 백색소음
  muted: false,
  bgmPlaying: false,
  bgmStep: 0,          // 배경음악 현재 16분음표 위치
  bgmNextTime: 0,      // 다음 음을 예약할 시각(AudioContext 시간)

  // 저장된 소리 설정 읽기. 사생활 보호 모드 등에서 실패해도 게임은 계속된다.
  loadSetting() {
    try { this.muted = localStorage.getItem(CONFIG.STORAGE_MUTED) === '1'; } catch (e) { /* 무시 */ }
  },

  // 첫 터치·클릭·키 입력 때 호출: 오디오를 만들고 깨운다
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;                 // 소리를 지원하지 않는 브라우저: 소리 없이 진행
      const ac = new AC();
      this.ctx = ac;
      this.master = ac.createGain();
      this.master.gain.value = this.muted ? 0 : 1;
      this.master.connect(ac.destination);
      this.sfxBus = ac.createGain();
      this.sfxBus.gain.value = CONFIG.SFX_VOLUME;
      this.sfxBus.connect(this.master);
      this.bgmBus = ac.createGain();
      this.bgmBus.gain.value = CONFIG.BGM_VOLUME;
      this.bgmBus.connect(this.master);
      // 1초 길이 백색소음 (스네어·하이햇·피격음에 재사용)
      this.noiseBuffer = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const data = this.noiseBuffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },

  // 깨우는 중(suspended)에도 예약해 두면 깨어난 뒤 재생된다 (첫 "3" 소리가 빠지지 않게)
  ready() {
    return this.ctx !== null && this.ctx.state !== 'closed';
  },

  toggle() {
    this.muted = !this.muted;
    try { localStorage.setItem(CONFIG.STORAGE_MUTED, this.muted ? '1' : '0'); } catch (e) { /* 무시 */ }
    if (this.master) this.master.gain.setValueAtTime(this.muted ? 0 : 1, this.ctx.currentTime);
    if (!this.muted) this.play('click');
  },

  // 효과음 재생. name은 SFX의 이름, arg는 추가 정보(예: 아이템 점수)
  play(name, arg) {
    if (this.muted || !this.ready()) return;
    try {
      SFX[name](this.ctx.currentTime + 0.01, arg);
    } catch (e) {
      console.warn('효과음 오류', name, e);   // 소리 오류로 게임이 멈추지 않게
    }
  },

  // 음 하나: 주파수(끝 주파수로 미끄러짐 가능), 파형, 길이, 크기
  tone(start, { freq, to, dur, type = 'square', vol = 0.3, bus = this.sfxBus }) {
    const ac = this.ctx;
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, start + dur);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(g);
    g.connect(bus);
    osc.start(start);
    osc.stop(start + dur + 0.02);
  },

  // 잡음 하나: 필터로 음색을 바꾼다 (highpass = 치익, bandpass = 탁)
  noise(start, { dur, vol = 0.3, filter = 'highpass', freq = 6000, bus = this.sfxBus }) {
    const ac = this.ctx;
    const src = ac.createBufferSource();
    src.buffer = this.noiseBuffer;
    const f = ac.createBiquadFilter();
    f.type = filter;
    f.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, start);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    src.connect(f);
    f.connect(g);
    g.connect(bus);
    src.start(start);
    src.stop(start + dur + 0.02);
  },

  // 매 프레임 호출: 플레이 중이면 배경음악을 조금 앞까지 미리 예약한다
  update(wantBgm) {
    if (!wantBgm || this.muted || !this.ready()) {
      this.bgmPlaying = false;
      return;
    }
    const now = this.ctx.currentTime;
    // 새로 시작했거나 (탭 전환 등으로) 예약이 크게 밀렸으면 지금부터 다시 맞춘다
    if (!this.bgmPlaying || this.bgmNextTime < now - 0.1) this.bgmNextTime = now + 0.05;
    this.bgmPlaying = true;
    const stepTime = 60 / CONFIG.BGM_BPM / 4;   // 16분음표 길이(초)
    while (this.bgmNextTime < now + 0.15) {
      try { BGM.step(this.bgmStep, this.bgmNextTime); } catch (e) { console.warn('배경음악 오류', e); }
      this.bgmNextTime += stepTime;
      this.bgmStep = (this.bgmStep + 1) % BGM.LENGTH;
    }
  },

  // 새 판을 시작하면 배경음악을 처음 박자부터
  restartBgm() {
    this.bgmStep = 0;
    this.bgmPlaying = false;
  },
};
Sound.loadSetting();

// 효과음 모음: (시작 시각, 추가 정보) → 소리 예약
const SFX = {
  // 아이템 획득: 점수가 높을수록 높은 음, 챔피언 벨트는 세 음
  catch(t, score) {
    const notes = { 10: [660], 20: [784], 30: [988], 50: [1047, 1319, 1568] }[score] || [660];
    notes.forEach((freq, i) => {
      Sound.tone(t + i * 0.06, { freq, dur: 0.12, vol: 0.25 });
      Sound.tone(t + i * 0.06 + 0.04, { freq: freq * 2, dur: 0.08, vol: 0.1 });   // 반짝이는 윗음
    });
  },
  // 정크푸드: 낮게 떨어지는 음 + 퍽 소리
  hit(t) {
    Sound.tone(t, { freq: 220, to: 55, dur: 0.35, type: 'sawtooth', vol: 0.3 });
    Sound.noise(t, { dur: 0.18, vol: 0.4, filter: 'bandpass', freq: 800 });
  },
  // 레벨 업: 위로 올라가는 네 음
  levelUp(t) {
    [523, 659, 784, 1047].forEach((freq, i) => Sound.tone(t + i * 0.08, { freq, dur: 0.14, vol: 0.22 }));
  },
  // 카운트다운 3·2·1
  tick(t) {
    Sound.tone(t, { freq: 440, dur: 0.15, vol: 0.25 });
  },
  // START!
  go(t) {
    Sound.tone(t, { freq: 880, dur: 0.4, vol: 0.25 });
    Sound.tone(t, { freq: 1320, dur: 0.4, vol: 0.1 });
  },
  // 게임 종료: 시간 종료는 끝맺는 세 음, 하트 0은 내려가는 세 음
  end(t, reason) {
    const notes = reason === 'time' ? [784, 659, 1047] : [523, 415, 330];
    notes.forEach((freq, i) => Sound.tone(t + i * 0.16, { freq, dur: i === 2 ? 0.5 : 0.15, type: 'triangle', vol: 0.35 }));
  },
  // 버튼 누름
  click(t) {
    Sound.tone(t, { freq: 1200, dur: 0.05, vol: 0.15 });
  },
};

// 배경음악: 2마디(16분음표 32칸) 반복 비트. 킥·스네어·하이햇과 베이스 (복싱 체육관 느낌)
const BGM = {
  LENGTH: 32,
  KICK: [0, 8, 10, 16, 24, 30],
  SNARE: [4, 12, 20, 28],
  // 8분음표마다 베이스 음 (0은 쉼), A단조
  BASS: [110, 0, 110, 131, 110, 0, 147, 131, 110, 0, 110, 131, 98, 0, 165, 147],

  step(i, t) {
    const bus = Sound.bgmBus;
    if (this.KICK.includes(i)) Sound.tone(t, { freq: 150, to: 40, dur: 0.18, type: 'sine', vol: 0.9, bus });
    if (this.SNARE.includes(i)) Sound.noise(t, { dur: 0.12, vol: 0.45, filter: 'bandpass', freq: 1800, bus });
    if (i % 2 === 0) Sound.noise(t, { dur: 0.04, vol: i % 4 === 2 ? 0.25 : 0.12, filter: 'highpass', freq: 7000, bus });
    if (i % 2 === 0) {
      const freq = this.BASS[i / 2];
      if (freq) Sound.tone(t, { freq, dur: 0.1, type: 'square', vol: 0.18, bus });
    }
  },
};

// ============================================================
// Share: 결과 공유 (PRD 7-1항, 7항 F8)
// 1) 결과 카드 이미지를 만들고 2) 이미지 공유를 지원하면 공유 창을 열고
// 3) 지원하지 않으면 "이미지 저장 / 문구 복사" 선택 창을 띄운다.
// ============================================================
const Share = {
  card: null,          // 결과 카드 캔버스
  file: null,          // 공유용 PNG 파일 (만드는 중이면 null)
  panelOpen: false,    // 이미지 저장·문구 복사 선택 창
  message: '',         // 잠깐 보여 줄 안내 문구
  messageTime: 0,

  reset() {
    this.card = null;
    this.file = null;
    this.panelOpen = false;
    this.message = '';
    this.messageTime = 0;
  },

  // 게임 주소 (내 PC에서 파일로 연 경우에는 다른 사람이 열 수 없으므로 넣지 않는다)
  link() {
    if (!/^https?:$/.test(location.protocol)) return '';
    return location.origin + location.pathname;
  },

  text() {
    const link = this.link();
    return `펀치 캐치에서 ${game.score.toLocaleString()}점 달성! 🥊 너도 도전해 봐` + (link ? ` → ${link}` : '');
  },

  fileName() {
    return `punch-catch-${game.score}.png`;
  },

  prepare() {
    this.reset();
    this.card = drawShareCard();
    try {
      this.card.toBlob((blob) => {
        if (!blob || this.card === null) return;   // 그 사이 새 판을 시작했으면 버림
        try {
          this.file = new File([blob], this.fileName(), { type: 'image/png' });
        } catch (e) { /* File을 만들 수 없는 브라우저: 선택 창으로 대신한다 */ }
      }, 'image/png');
    } catch (e) { /* 무시 */ }
  },

  canShareFile() {
    try {
      return !!(this.file && navigator.canShare && navigator.canShare({ files: [this.file] }));
    } catch (e) {
      return false;
    }
  },

  // 공유하기 버튼
  open() {
    if (!this.canShareFile()) {
      this.panelOpen = true;
      return;
    }
    navigator.share({ files: [this.file], title: '펀치 캐치', text: this.text() })
      .catch((e) => {
        if (e && e.name === 'AbortError') return;   // 사용자가 공유 창을 닫음
        this.panelOpen = true;                      // 그 밖의 실패는 선택 창으로
      });
  },

  closePanel() {
    this.panelOpen = false;
  },

  // 이미지 저장: 다운로드 링크를 눌러서 PNG를 내려받는다
  download() {
    if (!this.card) return;
    try {
      const a = document.createElement('a');
      a.href = this.card.toDataURL('image/png');
      a.download = this.fileName();
      document.body.appendChild(a);
      a.click();
      a.remove();
      this.show('이미지를 저장했어요');
    } catch (e) {
      this.show('이미지를 저장하지 못했어요');
    }
  },

  // 문구 복사: 클립보드 API가 안 되면 예전 방식(execCommand)으로
  copy() {
    const text = this.text();
    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        this.show(ok ? '문구를 복사했어요' : '복사하지 못했어요');
      } catch (e) {
        this.show('복사하지 못했어요');
      }
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => this.show('문구를 복사했어요'), fallback);
    } else {
      fallback();
    }
  },

  show(message) {
    this.message = message;
    this.messageTime = CONFIG.MESSAGE_TIME;
  },

  update(dt) {
    this.messageTime = Math.max(0, this.messageTime - dt);
  },
};

// 공유용 결과 카드: 정사각형 이미지에 게임 이름, 점수, 받은 아이템 개수
function drawShareCard() {
  const size = CONFIG.SHARE_CARD_SIZE;
  const col = CONFIG.COLORS;
  const p = CONFIG.PIXEL;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  const cx = size / 2;

  // 링 위쪽(로프와 기둥)을 배경으로 쓰고 어둡게 덮는다
  g.drawImage(background, 0, 0, size / p, size / p, 0, 0, size, size);
  g.fillStyle = 'rgba(11, 16, 24, 0.6)';
  g.fillRect(0, 0, size, size);

  drawText('펀치 캐치', cx, 210, 88, col.accent, 'center', g);
  drawText('PUNCH CATCH', cx, 256, 28, col.text, 'center', g);
  drawText(game.score.toLocaleString() + '점', cx, 400, 112, col.text, 'center', g);
  if (game.newRecord) drawText('NEW RECORD!', cx, 458, 36, col.accent, 'center', g);
  else drawText(`최고 점수 ${Record.best.toLocaleString()}`, cx, 458, 28, col.accent, 'center', g);

  // 복싱 아이템 그림과 받은 개수
  GOOD_ITEMS.forEach((def, i) => {
    const x = 135 + i * 150;
    const sprite = Assets.sprites[def.id];
    g.drawImage(sprite, x - (sprite.width * p) / 2, 506, sprite.width * p, sprite.height * p);
    drawText(`× ${game.caught[def.id] || 0}`, x, 632, 30, col.text, 'center', g);
  });
  drawText('너도 도전해 봐!', cx, 690, 26, col.text, 'center', g);
  return c;
}

// 도트 글꼴 글자 + 아래쪽 그림자 (도트 게임 느낌)
// g: 그릴 캔버스 (기본은 게임 화면, 공유 카드를 만들 때는 카드 캔버스)
function drawText(text, x, y, size, color, align = 'center', g = ctx) {
  g.font = `${size}px ${CONFIG.FONT}`;
  g.textAlign = align;
  g.textBaseline = 'alphabetic';
  g.fillStyle = CONFIG.COLORS.textShadow;
  g.fillText(text, x, y + CONFIG.PIXEL);
  g.fillStyle = color;
  g.fillText(text, x, y);
}

// HUD: 하트 / 남은 시간 / 점수 (PRD 6-2항)
function drawHud() {
  const col = CONFIG.COLORS;
  const p = CONFIG.PIXEL;
  const top = 184;   // 링 로프·코너 기둥 아래
  const margin = 40; // 좌우 여백

  // 하트 (왼쪽)
  for (let i = 0; i < CONFIG.START_HEARTS; i++) {
    const sprite = i < game.hearts ? Assets.sprites.heart : Assets.sprites.heartEmpty;
    Assets.draw(sprite, margin + i * (sprite.width + 2) * p, top + 12);
  }
  // 방금 잃은 하트: 빈 하트 위에서 두 쪽으로 갈라져 떨어진다
  if (Effects.heartBreak > 0) {
    const heart = Assets.sprites.heart;
    const t = 1 - Effects.heartBreak / CONFIG.HEART_BREAK_TIME;   // 0 → 1
    const x = margin + Effects.heartIndex * (heart.width + 2) * p;
    const y = top + 12;
    const half = Math.ceil(heart.width / 2);
    const snap = (v) => Math.round(v / p) * p;
    const spread = snap(t * 24);
    const drop = snap(t * t * 48);
    ctx.globalAlpha = 1 - t;
    ctx.drawImage(heart, 0, 0, half, heart.height,
      x - spread, y + drop, half * p, heart.height * p);
    ctx.drawImage(heart, half, 0, heart.width - half, heart.height,
      x + half * p + spread, y + drop, (heart.width - half) * p, heart.height * p);
    ctx.globalAlpha = 1;
  }
  // 현재 난이도 단계 (하트 아래)
  drawText(`LEVEL ${game.levelIndex + 1}`, margin, top + 104, 24, col.accent, 'left');

  // 남은 시간 (가운데). 올림 처리해 0.1초 남았을 때도 1로 보이게 한다.
  const sec = Math.ceil(game.timeLeft);
  const timeColor = sec <= CONFIG.TIME_WARNING ? col.warning : col.text;
  drawText('TIME', CONFIG.WIDTH / 2, top + 20, 24, col.accent);
  drawText(String(sec), CONFIG.WIDTH / 2, top + 68, 48, timeColor);

  // 점수 (오른쪽)
  drawText('SCORE', CONFIG.WIDTH - margin, top + 20, 24, col.accent, 'right');
  drawText(game.score.toLocaleString(), CONFIG.WIDTH - margin, top + 68, 48, col.text, 'right');
}

  // 결과 화면은 잠시 기다린 뒤에만 버튼이 동작한다 (플레이 중 누르던 손가락 오작동 방지)
  buttonsReady() {
    return Screen.state !== 'result' || Screen.time >= CONFIG.RESTART_DELAY;
  },

  // 화면을 눌렀을 때. 반환값: 이동 입력으로 쓰지 않을지 여부
  press(x, y) {
    if (Screen.state === 'play') {
      if (inRect(PAUSE_BUTTON, x, y, PAUSE_TOUCH_PAD)) {
        Sound.play('click');
        PAUSE_BUTTON.action();
        return true;
      }
      return false;
    }
    const soundButton = SOUND_BUTTONS[Screen.state];
    if (soundButton && inRect(soundButton, x, y, PAUSE_TOUCH_PAD)) {
      Sound.toggle();
      return true;
    }
    const buttons = currentButtons();
    if (!buttons) return false;                    // 카운트다운: 이동만 가능
    if (!this.buttonsReady()) return true;
    const hit = buttons.find((b) => inRect(b, x, y));
    if (hit) {
      Sound.play('click');
      hit.action();
    }
    return true;                                   // 버튼 밖을 눌러도 메뉴 화면에서는 무시
  },

  // 키보드: 엔터·스페이스 = 주 버튼, Esc·P = 일시정지/계속하기, M = 소리 켜기/끄기.
  // 반환값: 처리했는지 여부
  key(key) {
    if (key === 'm' || key === 'M') {
      Sound.toggle();
      return true;
    }
    if (key === 'Escape' || key === 'p' || key === 'P') {
      if (Screen.state === 'play') { pauseGame(); return true; }
      if (Screen.state === 'paused') { resumeGame(); return true; }
      if (Share.panelOpen && key === 'Escape') { Share.closePanel(); return true; }
      return false;
    }
    if (key === ' ' || key === 'Enter') {
      const buttons = currentButtons();
      if (!buttons) return Screen.state === 'play';  // 플레이 중 스페이스로 페이지가 스크롤되지 않게
      if (this.buttonsReady()) {
        Sound.play('click');
        buttons.find((b) => b.primary).action();
      }
      return true;
    }
    return false;
  },
};

// 도트 버튼: 모서리를 한 칸 깎은 상자 + 아래쪽 그림자 줄
function drawButton(b) {
  const col = CONFIG.COLORS;
  const p = CONFIG.PIXEL;
  const x = Math.round(b.x / p) * p;
  const y = Math.round(b.y / p) * p;
  const { w, h } = b;
  const fill = b.primary ? col.accent : col.button;
  const dark = b.primary ? col.accentDark : col.buttonDark;

  ctx.fillStyle = col.textShadow;                       // 외곽선
  ctx.fillRect(x + p, y, w - 2 * p, h);
  ctx.fillRect(x, y + p, w, h - 2 * p);
  ctx.fillStyle = fill;                                 // 바탕
  ctx.fillRect(x + 2 * p, y + p, w - 4 * p, h - 2 * p);
  ctx.fillRect(x + p, y + 2 * p, w - 2 * p, h - 4 * p);
  ctx.fillStyle = dark;                                 // 아래쪽 입체감
  ctx.fillRect(x + 2 * p, y + h - 3 * p, w - 4 * p, 2 * p);

  ctx.font = `36px ${CONFIG.FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = b.primary ? col.buttonText : col.text;
  ctx.fillText(b.label, x + w / 2, y + h / 2 - p);
}

function drawButtons() {
  const buttons = currentButtons();
  if (!buttons) return;
  ctx.globalAlpha = UI.buttonsReady() ? 1 : 0.4;
  buttons.forEach(drawButton);
  ctx.globalAlpha = 1;
}

// 일시정지 버튼 아이콘 (II)
function drawPauseButton() {
  const col = CONFIG.COLORS;
  const p = CONFIG.PIXEL;
  const { x, y, w, h } = PAUSE_BUTTON;
  drawButton({ x, y, w, h, label: '', primary: false });
  ctx.fillStyle = col.text;
  ctx.fillRect(x + 5 * p, y + 4 * p, 2 * p, 7 * p);
  ctx.fillRect(x + 9 * p, y + 4 * p, 2 * p, 7 * p);
}

// 소리 켜기/끄기 버튼: 스피커 + 음파(켜짐) 또는 X(꺼짐)
function drawSoundButton() {
  const col = CONFIG.COLORS;
  const p = CONFIG.PIXEL;
  const { x, y, w, h } = SOUND_BUTTONS[Screen.state];
  drawButton({ x, y, w, h, label: '', primary: false });
  const px = (cx, cy, cw = 1, ch = 1) => ctx.fillRect(x + cx * p, y + cy * p, cw * p, ch * p);
  ctx.fillStyle = col.text;
  px(3, 6, 2, 3);            // 스피커 몸통
  px(5, 5, 1, 5);
  px(6, 4, 1, 7);            // 스피커 나팔
  if (Sound.muted) {
    ctx.fillStyle = col.warning;
    for (let i = 0; i < 4; i++) {
      px(9 + i, 5 + i);      // X
      px(12 - i, 5 + i);
    }
  } else {
    px(8, 6, 1, 3);          // 작은 음파
    px(10, 5, 1, 5);         // 큰 음파
    px(9, 4); px(9, 10);
  }
}

function dim() {
  ctx.fillStyle = CONFIG.COLORS.overlay;
  ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
}

// 시작 화면 (PRD 6-1항). 최고 점수는 8단계, 소리 버튼은 7단계에서 추가한다.
function drawTitle() {
  const col = CONFIG.COLORS;
  const cx = CONFIG.WIDTH / 2;
  const s = Assets.sprites;

  drawText('펀치 캐치', cx, 288, 104, col.accent);
  drawText('PUNCH CATCH', cx, 340, 32, col.text);
  drawText(`최고 점수 ${Record.best.toLocaleString()}`, cx, 388, 26, col.accent);

  drawText('복싱 용품은 받고,', cx, 456, 32, col.text);
  drawText('정크푸드는 피하세요!', cx, 498, 32, col.text);

  // 복싱 아이템과 점수
  GOOD_ITEMS.forEach((def, i) => {
    const x = 135 + i * 150;
    const sprite = s[def.id];
    Assets.draw(sprite, x - (sprite.width * CONFIG.PIXEL) / 2, 540);
    drawText(def.name, x, 650, 22, col.text);
    drawText(`+${def.score}`, x, 684, 26, col.accent);
  });

  // 정크푸드
  BAD_ITEMS.forEach((def, i) => {
    const sprite = s[def.id];
    Assets.draw(sprite, 210 + i * 150 - (sprite.width * CONFIG.PIXEL) / 2, 730);
  });
  drawText('하트 -1', cx, 850, 26, col.warning);

  drawText('드래그 · 화면 좌우 터치 · ←/→ 키', cx, 910, 22, col.text);
}

// 카운트다운 3 → 2 → 1 (PRD 3항)
function drawCountdown() {
  const n = Math.ceil(CONFIG.COUNTDOWN_TIME - Screen.time);
  drawText(String(Math.max(1, n)), CONFIG.WIDTH / 2, 700, 200, CONFIG.COLORS.accent);
  drawText('준비!', CONFIG.WIDTH / 2, 480, 40, CONFIG.COLORS.text);
}

function drawPaused() {
  drawText('일시정지', CONFIG.WIDTH / 2, 480, 72, CONFIG.COLORS.text);
}

// 결과 화면 (PRD 6-3항). 최고 점수와 공유하기는 8단계에서 추가한다.
function drawResult() {
  const col = CONFIG.COLORS;
  const cx = CONFIG.WIDTH / 2;

  drawText('게임 종료', cx, 300, 72, col.text);
  drawText(game.endReason === 'time' ? '시간 종료' : '하트를 모두 잃었어요', cx, 360, 32, col.accent);
  drawText(game.score.toLocaleString() + '점', cx, 480, 88, col.text);

  // 최고 점수: 갱신했으면 NEW RECORD!가 크게 깜빡인다 (PRD 6-3항)
  if (game.newRecord) {
    if (Math.floor(Screen.time * 3) % 2 === 0) drawText('NEW RECORD!', cx, 548, 44, col.accent);
  } else {
    drawText(`최고 점수 ${Record.best.toLocaleString()}`, cx, 544, 30, col.accent);
  }

  // 아이템별 받은 개수
  const rowY = (i) => 616 + i * 46;
  GOOD_ITEMS.forEach((def, i) => {
    drawText(`${def.name} (${def.score}점)`, cx - 20, rowY(i), 28, col.text, 'right');
    drawText(`× ${game.caught[def.id] || 0}`, cx + 20, rowY(i), 28, col.text, 'left');
  });
  const badCount = BAD_ITEMS.reduce((sum, def) => sum + (game.caught[def.id] || 0), 0);
  const badY = rowY(GOOD_ITEMS.length);
  drawText('정크푸드', cx - 20, badY, 28, col.warning, 'right');
  drawText(`× ${badCount}`, cx + 20, badY, 28, col.warning, 'left');
}

// 공유 선택 창: 카드 미리보기 + 이미지 저장·문구 복사·돌아가기
function drawSharePanel() {
  const cx = CONFIG.WIDTH / 2;
  drawText('결과 공유', cx, 200, 56, CONFIG.COLORS.text);
  if (Share.card) {
    const s = 440;   // 미리보기 크기
    const x = cx - s / 2;
    const y = 250;
    ctx.fillStyle = CONFIG.COLORS.textShadow;
    ctx.fillRect(x - CONFIG.PIXEL, y - CONFIG.PIXEL, s + CONFIG.PIXEL * 2, s + CONFIG.PIXEL * 2);
    ctx.imageSmoothingEnabled = true;   // 카드를 줄여 보여 줄 때는 부드럽게
    ctx.drawImage(Share.card, x, y, s, s);
    ctx.imageSmoothingEnabled = false;
  }
}

// "복사했어요" 같은 안내 문구 (화면 아래쪽, 끝에서 흐려짐)
function drawShareMessage() {
  if (Share.messageTime <= 0) return;
  ctx.globalAlpha = Math.min(1, Share.messageTime / 0.3);
  const w = 440;
  const h = 72;
  const x = (CONFIG.WIDTH - w) / 2;
  const y = 1190;
  ctx.fillStyle = CONFIG.COLORS.textShadow;
  ctx.fillRect(x, y, w, h);
  drawText(Share.message, CONFIG.WIDTH / 2, y + 48, 28, CONFIG.COLORS.text);
  ctx.globalAlpha = 1;
}

function drawItems() {
  for (const it of items) {
    Assets.draw(Assets.sprites[it.def.id], it.x - it.w / 2, it.y);
  }
}

// 점수 팝업(위로 떠오르며 사라짐)과 도트 파편
function drawEffects() {
  const p = CONFIG.PIXEL;
  for (const pt of Effects.particles) {
    ctx.globalAlpha = 1 - pt.time / CONFIG.PARTICLE_TIME;
    ctx.fillStyle = pt.color;
    ctx.fillRect(Math.round(pt.x / p) * p, Math.round(pt.y / p) * p, p * 2, p * 2);
  }
  for (const pop of Effects.popups) {
    const t = pop.time / CONFIG.POPUP_TIME;
    ctx.globalAlpha = t < 0.6 ? 1 : 1 - (t - 0.6) / 0.4;    // 마지막 40%에서 흐려짐
    const rise = CONFIG.POPUP_RISE * (1 - (1 - t) * (1 - t));  // 처음엔 빠르게, 끝에서 천천히
    drawText(pop.text, pop.x, pop.y - rise, 40, pop.color);
  }
  ctx.globalAlpha = 1;
}

// 정크푸드를 받았을 때 화면 전체가 빨갛게 번쩍임
function drawHitFlash() {
  if (Effects.flash <= 0) return;
  ctx.globalAlpha = 0.35 * (Effects.flash / CONFIG.HIT_FLASH_TIME);
  ctx.fillStyle = CONFIG.COLORS.warning;
  ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
  ctx.globalAlpha = 1;
}

function currentPlayerSprite() {
  const s = Assets.sprites;
  if (Effects.pose > 0) return s.playerCatch;
  if (!player.moving) return s.playerStand;
  const frame = Math.floor(player.walkTime / CONFIG.WALK_FRAME_TIME) % 2;
  return frame === 0 ? s.playerStepL : s.playerStepR;
}

function render() {
  // 캔버스 크기가 바뀌면 설정이 초기화되므로 매 프레임 지정
  ctx.imageSmoothingEnabled = false;

  const state = Screen.state;

  // 피격 흔들림: 플레이 중에만 화면 전체를 살짝 밀어서 그린다
  const shake = state === 'play' ? Effects.shakeOffset() : { x: 0, y: 0 };
  ctx.save();
  if (shake.x || shake.y) {
    ctx.fillStyle = CONFIG.COLORS.textShadow;     // 밀린 가장자리에 이전 화면이 남지 않게
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
    ctx.translate(shake.x, shake.y);
  }
  ctx.drawImage(background, 0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
  renderScene(state);
  ctx.restore();
  if (state === 'play') drawHitFlash();
}

function renderScene(state) {

  // 시작 화면: 어둡게 덮은 링 위에 캐릭터만 밝게 보여 준다
  if (state === 'title') {
    dim();
    drawPlayer();
    drawTitle();
    drawButtons();
    drawSoundButton();
    return;
  }

  drawPlayer();
  // 결과 화면은 점수를 따로 보여 주므로 HUD·아이템이 제목 뒤에 비치지 않게 생략
  if (state !== 'result') {
    drawItems();   // 받는 순간 캐릭터 앞에 보이도록 아이템을 나중에 그림
    drawEffects();
    drawHud();
  }

  if (state === 'play') {
    drawPauseButton();
    if (Screen.playTime < CONFIG.START_FLASH_TIME) {
      drawText('START!', CONFIG.WIDTH / 2, 700, 120, CONFIG.COLORS.accent);
    }
    if (game.levelUpTimer > 0) {
      drawText('LEVEL UP!', CONFIG.WIDTH / 2, 640, 88, CONFIG.COLORS.accent);
      drawText(`LEVEL ${game.levelIndex + 1}`, CONFIG.WIDTH / 2, 700, 36, CONFIG.COLORS.text);
    }
  } else if (state === 'countdown') {
    drawCountdown();
  } else {
    dim();
    // 공유 선택 창은 결과 글자가 뒤에 비치지 않게 결과 대신 그린다
    if (state === 'paused') drawPaused();
    else if (Share.panelOpen) drawSharePanel();
    else drawResult();
    drawButtons();
    if (state === 'paused') drawSoundButton();
    if (state === 'result') drawShareMessage();
  }
}

function drawPlayer() {
  Assets.drawShadow(player.x, player.y, 24);
  // 무적 시간에는 0.1초 간격으로 깜빡임 (PRD 4-1항)
  const blinkOff = game.invincible > 0 && Math.floor(game.invincible * 10) % 2 === 0;
  if (!blinkOff) {
    // 두 팔 든 자세는 키가 커서 그림 높이 기준으로 발 위치를 맞춘다
    const sprite = currentPlayerSprite();
    Assets.draw(sprite, player.x - player.w / 2, player.y - sprite.height * CONFIG.PIXEL);
  }
}

// ============================================================
// 게임 루프: 경과 시간(dt) 기반 (PRD 9항)
// ============================================================
let lastTime = performance.now();

function update(dt) {
  const prevTime = Screen.time;
  Screen.time += dt;
  Share.update(dt);
  if (Screen.state === 'countdown') {
    updatePlayer(dt);
    if (Screen.time >= CONFIG.COUNTDOWN_TIME) {
      setScreen('play');
      Sound.play('go');
    } else if (prevTime === 0 ||
        Math.ceil(CONFIG.COUNTDOWN_TIME - prevTime) !== Math.ceil(CONFIG.COUNTDOWN_TIME - Screen.time)) {
      Sound.play('tick');   // 화면의 숫자가 3 → 2 → 1로 바뀌는 순간
    }
  } else if (Screen.state === 'play') {
    Screen.playTime += dt;
    updateTimer(dt);
    if (!game.over) {
      updateLevel(dt);
      updatePlayer(dt);
      updateItems(dt);
    }
    Effects.update(dt);
  }
  // title·paused·result: 게임 시간이 흐르지 않는다
}

function loop(now) {
  // 탭 전환 등으로 오래 멈췄다 돌아와도 캐릭터가 순간이동하지 않게 dt 상한
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  update(dt);
  Sound.update(Screen.state === 'play');   // 배경음악은 플레이 중에만
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
