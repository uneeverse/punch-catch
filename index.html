    image-rendering: pixelated;   /* 도트가 흐려지지 않게 */

  WALK_FRAME_TIME: 0.12,         // 걷기 그림이 바뀌는 간격(초)

  TIME_WARNING: 10,              // 남은 시간이 이 값 이하이면 빨간색으로 표시
  RESTART_DELAY: 0.8,            // 결과 화면이 나온 직후 실수로 버튼을 누르지 않게 기다리는 시간(초)
  COUNTDOWN_TIME: 3,             // 시작 전 카운트다운(초) (PRD 3항)

// ============================================================
// 화면 설정: 논리 해상도를 화면에 비율 맞춰 표시 (PRD 9항)
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let scale = 1;   // 논리 px → CSS px 배율

function resize() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  scale = Math.min(vw / CONFIG.WIDTH, vh / CONFIG.HEIGHT);

  const cssW = Math.floor(CONFIG.WIDTH * scale);
  const cssH = Math.floor(CONFIG.HEIGHT * scale);
  const dpr = window.devicePixelRatio || 1;

  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.floor(cssW * dpr);    // 고해상도 화면에서도 선명하게
  canvas.height = Math.floor(cssH * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.visualViewport?.addEventListener('resize', resize);  // 모바일 주소창 변화 대응
resize();

// ============================================================
// Input: 터치·마우스·키보드 입력 (PRD 5항)
// ============================================================
const Input = {
  keys: { left: false, right: false },
  pointerId: null,     // 현재 추적 중인 손가락(또는 마우스)
  startX: 0,
  pointerX: 0,
  dragging: false,     // true면 드래그, false면 누르고 있기(탭 이동)

  // 화면 좌표를 논리 좌표(x)로 변환
  toLogicalX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) / scale;
  },
  toLogicalY(clientY) {
    const rect = canvas.getBoundingClientRect();
    return (clientY - rect.top) / scale;
  },

  // 눌린 키와 손가락을 모두 해제 (화면 전환·창 이동 시)
  reset() {
    this.keys.left = this.keys.right = false;
    this.pointerId = null;
    this.dragging = false;
  },

  // -1(왼쪽), 0(정지), 1(오른쪽): 키보드 또는 탭 이동 방향
  holdDirection() {
    if (this.pointerId !== null && !this.dragging) {
      return this.pointerX < CONFIG.WIDTH / 2 ? -1 : 1;
    }
    return (this.keys.right ? 1 : 0) - (this.keys.left ? 1 : 0);
  },

  init() {
    canvas.addEventListener('pointerdown', (e) => {
      if (this.pointerId !== null) return;   // 첫 번째 손가락만 사용
      const x = this.toLogicalX(e.clientX);
      const y = this.toLogicalY(e.clientY);
      if (UI.press(x, y)) return;            // 버튼을 눌렀으면 이동 입력으로 쓰지 않음
      if (!canMove()) return;
      this.pointerId = e.pointerId;
      this.startX = this.pointerX = x;
      this.dragging = false;
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (e.pointerId !== this.pointerId) return;
      this.pointerX = this.toLogicalX(e.clientX);
      if (Math.abs(this.pointerX - this.startX) > CONFIG.DRAG_THRESHOLD) {
        this.dragging = true;   // 드래그가 탭보다 우선 (PRD 5항)
      }
    });
    const release = (e) => {
      if (e.pointerId !== this.pointerId) return;
      this.pointerId = null;
      this.dragging = false;
    };
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);

    const setKey = (e, pressed) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') this.keys.left = pressed;
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.keys.right = pressed;
      else return;
      e.preventDefault();
    };
    window.addEventListener('keydown', (e) => {
      if (UI.key(e.key)) { e.preventDefault(); return; }   // 화면 전환 키 (엔터·스페이스·Esc·P)
      setKey(e, true);
    });
    window.addEventListener('keyup', (e) => setKey(e, false));

    // 다른 창으로 이동하면 눌린 키를 모두 해제 (키가 눌린 채로 남는 문제 방지)
    window.addEventListener('blur', () => this.reset());
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  },
};
Input.init();

// 글자 배열을 1칸 = 1px 캔버스로 미리 그려 둔다 (매 프레임 다시 그리지 않음)
function makeSprite(rows, mirror = false) {
  const w = rows[0].length;
  const h = rows.length;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  rows.forEach((row, y) => {
    if (row.length !== w) console.warn(`도트 그림 ${y}번째 줄 길이가 다릅니다: ${row.length}`);
    for (let x = 0; x < w; x++) {
      const color = PALETTE[row[x]];
      if (!color) continue;
      g.fillStyle = color;
      g.fillRect(mirror ? w - 1 - x : x, y, 1, 1);
    }
  });
  return c;
}

    heartEmpty: makeSprite(HEART_EMPTY_ART),
    // 아이템 그림: ITEM_ART의 이름(id) 그대로 사용
    ...Object.fromEntries(
      Object.entries(ITEM_ART).map(([id, rows]) => [id, makeSprite(rows)])
    ),
  },

  // 도트 그림을 PIXEL배로 키워 그린다. 위치를 도트 격자에 맞춰 반쯤 걸친 도트가 없게 한다.
  draw(sprite, x, y) {
    const p = CONFIG.PIXEL;
    ctx.drawImage(sprite,
      Math.round(x / p) * p, Math.round(y / p) * p,
      sprite.width * p, sprite.height * p);
  },

  // 캐릭터 발밑 그림자 (도트 계단 모양 타원)
  drawShadow(cx, footY, widthDots) {
    const p = CONFIG.PIXEL;
    const x = Math.round(cx / p) * p;
    const y = Math.round(footY / p) * p;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fillRect(x - (widthDots / 2 - 2) * p, y - p, (widthDots - 4) * p, p);
    ctx.fillRect(x - (widthDots / 2) * p, y, widthDots * p, p);
    ctx.fillRect(x - (widthDots / 2 - 2) * p, y + p, (widthDots - 4) * p, p);
  },
};

// ============================================================
// 배경: 도트 링 매트를 한 번만 그려 두고 매 프레임 붙여 넣는다
// ============================================================
const background = (() => {
  const p = CONFIG.PIXEL;
  const w = CONFIG.WIDTH / p;     // 180칸
  const h = CONFIG.HEIGHT / p;    // 320칸
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  const col = CONFIG.COLORS;

  // 매트 바탕과 잔잔한 점무늬
  g.fillStyle = col.mat;
  g.fillRect(0, 0, w, h);
  g.fillStyle = col.matDot;
  for (let y = 0; y < h; y += 4) {
    for (let x = (y / 4) % 2 === 0 ? 0 : 2; x < w; x += 4) g.fillRect(x, y, 1, 1);
  }

  // 매트 이음선
  g.fillStyle = col.matLine;
  for (let y = 60; y < h; y += 50) g.fillRect(0, y, w, 1);

  // 링 로프 3줄 (밝은 줄 · 기본 · 어두운 줄로 입체감)
  for (let i = 0; i < 3; i++) {
    const y = 12 + i * 8;
    g.fillStyle = col.ropeLight; g.fillRect(0, y, w, 1);
    g.fillStyle = col.rope;      g.fillRect(0, y + 1, w, 1);
    g.fillStyle = col.ropeDark;  g.fillRect(0, y + 2, w, 1);
  }

  // 양쪽 코너 기둥
  for (const x of [2, w - 6]) {
    g.fillStyle = col.postDark; g.fillRect(x, 6, 4, 34);
    g.fillStyle = col.post;     g.fillRect(x, 6, 3, 34);
    g.fillStyle = col.textShadow;
    g.fillRect(x - 1, 5, 6, 1);
    g.fillRect(x - 1, 40, 6, 1);
  }

  // 캐릭터가 서는 링 바닥 가장자리
  const floorY = Math.round((CONFIG.HEIGHT - CONFIG.PLAYER_BOTTOM_MARGIN) / p) + 6;
  g.fillStyle = col.text;
  g.fillRect(0, floorY, w, 1);
  g.fillStyle = col.matLine;
  g.fillRect(0, floorY + 1, w, h - floorY - 1);
  return c;
})();

// ============================================================
// Game: 상태와 갱신
// ============================================================
const player = {
  x: CONFIG.WIDTH / 2,                                  // 발 가운데 x
  y: CONFIG.HEIGHT - CONFIG.PLAYER_BOTTOM_MARGIN,       // 발 위치 y
  w: Assets.sprites.playerStand.width * CONFIG.PIXEL,
  h: Assets.sprites.playerStand.height * CONFIG.PIXEL,
  moving: false,
  walkTime: 0,                                          // 걷기 그림 전환용 누적 시간
};

function updatePlayer(dt) {
  const prevX = player.x;

  if (Input.pointerId !== null && Input.dragging) {
    // 드래그: 손가락 x를 부드럽게 따라감
    const t = Math.min(1, dt * CONFIG.DRAG_FOLLOW);
    player.x += (Input.pointerX - player.x) * t;
  } else {
    // 키보드·탭: 일정 속도로 이동
    player.x += Input.holdDirection() * CONFIG.WIDTH * CONFIG.PLAYER_SPEED_RATIO * dt;
  }

  // 화면 밖으로 나가지 않게 제한
  const half = player.w / 2;
  player.x = Math.max(half, Math.min(CONFIG.WIDTH - half, player.x));

  // 도트 반 칸 이상 움직였으면 걷는 중으로 판단
  player.moving = Math.abs(player.x - prevX) > CONFIG.PIXEL / 2;
  player.walkTime = player.moving ? player.walkTime + dt : 0;
}

// ------------------------------------------------------------
// 아이템 생성·낙하·충돌 (PRD 4-3~4-5항, 7항 F2·F3)
// ------------------------------------------------------------
const items = [];          // 화면에 떨어지고 있는 아이템
let spawnTimer = 0;        // 다음 생성까지 남은 시간(초)
let lastSpawnX = null;     // 직전에 생성한 아이템의 x (겹침 방지)
let level = CONFIG.LEVELS[0];

// ------------------------------------------------------------
// 점수·하트·타이머 (PRD 4-1·4-2·4-6항, 7항 F4)
// ------------------------------------------------------------
const game = {
  score: 0,
  hearts: CONFIG.START_HEARTS,
  timeLeft: CONFIG.GAME_TIME,
  invincible: 0,       // 남은 무적 시간(초)
  over: false,
  endReason: '',       // 'time' 또는 'hearts'
  caught: {},          // 아이템별 받은 개수 { jumpRope: 3, ... }
};

// ------------------------------------------------------------
// 화면 전환 (PRD 3항, 6항, 7항 F6)
// title → countdown → play ⇄ paused → result → countdown(다시 하기) 또는 title(처음으로)
// ------------------------------------------------------------
const Screen = {
  state: 'title',
  time: 0,             // 현재 화면에 들어온 뒤 지난 시간(초)
  playTime: 0,         // 플레이를 시작한 뒤 지난 시간(초, 일시정지 제외)
};

function setScreen(state) {
  Screen.state = state;
  Screen.time = 0;
  // 메뉴 화면으로 바뀌면 누르고 있던 입력을 놓은 것으로 처리
  // (카운트다운 → 플레이는 드래그를 이어서 할 수 있게 유지)
  if (!canMove()) Input.reset();
}

// 캐릭터를 움직일 수 있는 화면 (카운트다운 중에도 미리 자리를 잡을 수 있다)
function canMove() {
  return Screen.state === 'play' || Screen.state === 'countdown';
}

function resetGame() {
  game.score = 0;
  game.hearts = CONFIG.START_HEARTS;
  game.timeLeft = CONFIG.GAME_TIME;
  game.invincible = 0;
  game.over = false;
  game.endReason = '';
  game.caught = {};
  items.length = 0;
  spawnTimer = 0;
  lastSpawnX = null;
  player.x = CONFIG.WIDTH / 2;
  player.moving = false;
  player.walkTime = 0;
  Screen.playTime = 0;
}

function startGame() {
  resetGame();
  setScreen('countdown');
}

function goTitle() {
  resetGame();
  setScreen('title');
}

function pauseGame() {
  if (Screen.state === 'play') setScreen('paused');
}

function resumeGame() {
  if (Screen.state === 'paused') setScreen('play');
}

function endGame(reason) {
  game.over = true;
  game.endReason = reason;
  player.moving = false;
  setScreen('result');
}

// 받은 아이템 처리. 정크푸드는 무적 시간에는 영향이 없다.
// 반환값: 아이템을 화면에서 지울지 여부
function catchItem(def) {
  if (def.type === 'bad') {
    if (game.invincible > 0) return false;   // 무적 중에는 그대로 통과
    game.hearts--;
    game.invincible = CONFIG.INVINCIBLE_TIME;
    if (game.hearts <= 0) endGame('hearts');
  } else {
    game.score += def.score;
  }
  game.caught[def.id] = (game.caught[def.id] || 0) + 1;
  return true;
}

function updateTimer(dt) {
  game.invincible = Math.max(0, game.invincible - dt);
  game.timeLeft = Math.max(0, game.timeLeft - dt);
  if (game.timeLeft <= 0) endGame('time');
}

// weight 비율에 따라 하나를 무작위로 고른다
function pickWeighted(list) {
  const total = list.reduce((sum, it) => sum + it.weight, 0);
  let r = Math.random() * total;
  for (const it of list) {
    r -= it.weight;
    if (r < 0) return it;
  }
  return list[list.length - 1];
}

function spawnItem() {
  const type = Math.random() < level.badRatio ? 'bad' : 'good';
  const def = pickWeighted(CONFIG.ITEMS.filter((it) => it.type === type));
  const sprite = Assets.sprites[def.id];
  const w = sprite.width * CONFIG.PIXEL;
  const h = sprite.height * CONFIG.PIXEL;

  // 직전 아이템과 너무 가깝지 않은 x를 고른다 (몇 번 시도 후 포기)
  let x;
  for (let i = 0; i < 5; i++) {
    x = w / 2 + Math.random() * (CONFIG.WIDTH - w);
    if (lastSpawnX === null || Math.abs(x - lastSpawnX) >= CONFIG.SPAWN_MIN_GAP) break;
  }
  lastSpawnX = x;

  items.push({
    def,
    x,                 // 가운데 x
    y: -h,             // 위쪽 y (화면 위에서 시작)
    w,
    h,
    speed: level.fallSpeed * CONFIG.HEIGHT * def.speed,   // 초당 논리 px
  });
}

// 가운데 기준으로 줄인 충돌 상자
function hitbox(cx, top, w, h) {
  const r = CONFIG.HITBOX_RATIO;
  return {
    left: cx - (w * r) / 2,
    right: cx + (w * r) / 2,
    top: top + (h * (1 - r)) / 2,
    bottom: top + h - (h * (1 - r)) / 2,
  };
}

function overlaps(a, b) {
  return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
}

function updateItems(dt) {
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnItem();
    spawnTimer += level.spawnInterval;
  }

  const playerBox = hitbox(player.x, player.y - player.h, player.w, player.h);

  // 배열에서 지우면서 돌기 때문에 뒤에서부터 순회
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.speed * dt;

    if (overlaps(playerBox, hitbox(it.x, it.y, it.w, it.h))) {
      if (catchItem(it.def)) items.splice(i, 1);
      if (game.over) return;            // 마지막 하트를 잃으면 바로 멈춤
    } else if (it.y > CONFIG.HEIGHT) {
      items.splice(i, 1);               // 놓친 아이템은 하트·점수 변화 없음 (PRD 4-3항)
    }
  }
}

// 도트 글꼴 글자 + 아래쪽 그림자 (도트 게임 느낌)
function drawText(text, x, y, size, color, align = 'center') {
  ctx.font = `${size}px ${CONFIG.FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = CONFIG.COLORS.textShadow;
  ctx.fillText(text, x, y + CONFIG.PIXEL);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

// HUD: 하트 / 남은 시간 / 점수 (PRD 6-2항)
function drawHud() {
  const col = CONFIG.COLORS;
  const p = CONFIG.PIXEL;
  const top = 184;   // 링 로프·코너 기둥 아래
  const margin = 40; // 좌우 여백

  // 하트 (왼쪽)
  for (let i = 0; i < CONFIG.START_HEARTS; i++) {
    const sprite = i < game.hearts ? Assets.sprites.heart : Assets.sprites.heartEmpty;
    Assets.draw(sprite, margin + i * (sprite.width + 2) * p, top + 12);
  }

  // 남은 시간 (가운데). 올림 처리해 0.1초 남았을 때도 1로 보이게 한다.
  const sec = Math.ceil(game.timeLeft);
  const timeColor = sec <= CONFIG.TIME_WARNING ? col.warning : col.text;
  drawText('TIME', CONFIG.WIDTH / 2, top + 20, 24, col.accent);
  drawText(String(sec), CONFIG.WIDTH / 2, top + 68, 48, timeColor);

  // 점수 (오른쪽)
  drawText('SCORE', CONFIG.WIDTH - margin, top + 20, 24, col.accent, 'right');
  drawText(game.score.toLocaleString(), CONFIG.WIDTH - margin, top + 68, 48, col.text, 'right');
}

// UI: 화면별 버튼과 키 (PRD 6항)
// ------------------------------------------------------------
const GOOD_ITEMS = CONFIG.ITEMS.filter((it) => it.type === 'good');
const BAD_ITEMS = CONFIG.ITEMS.filter((it) => it.type === 'bad');
const BUTTON_W = 360;
const BUTTON_H = 96;
const centerButton = (label, y, action, primary = false) =>
  ({ label, x: (CONFIG.WIDTH - BUTTON_W) / 2, y, w: BUTTON_W, h: BUTTON_H, action, primary });

// 일시정지 버튼: HUD 점수 아래 오른쪽 (PRD 6-2항)
const PAUSE_BUTTON = { x: CONFIG.WIDTH - 40 - 64, y: 276, w: 64, h: 64, action: pauseGame };
const PAUSE_TOUCH_PAD = 16;   // 손가락으로 누르기 쉽게 판정 영역을 넓힘

const BUTTONS = {
  title: [centerButton('시작', 948, startGame, true)],
  paused: [
    centerButton('계속하기', 600, resumeGame, true),
    centerButton('처음으로', 730, goTitle),
  ],
  result: [
    centerButton('다시 하기', 900, startGame, true),
    centerButton('처음으로', 1024, goTitle),
  ],
};

const UI = {
  // 결과 화면은 잠시 기다린 뒤에만 버튼이 동작한다 (플레이 중 누르던 손가락 오작동 방지)
  buttonsReady() {
    return Screen.state !== 'result' || Screen.time >= CONFIG.RESTART_DELAY;
  },

  // 화면을 눌렀을 때. 반환값: 이동 입력으로 쓰지 않을지 여부
  press(x, y) {
    if (Screen.state === 'play') {
      const b = PAUSE_BUTTON;
      const pad = PAUSE_TOUCH_PAD;
      if (x >= b.x - pad && x <= b.x + b.w + pad && y >= b.y - pad && y <= b.y + b.h + pad) {
        b.action();
        return true;
      }
      return false;
    }
    const buttons = BUTTONS[Screen.state];
    if (!buttons) return false;                    // 카운트다운: 이동만 가능
    if (!this.buttonsReady()) return true;
    const hit = buttons.find((b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
    if (hit) hit.action();
    return true;                                   // 버튼 밖을 눌러도 메뉴 화면에서는 무시
  },

  // 키보드: 엔터·스페이스 = 주 버튼, Esc·P = 일시정지/계속하기. 반환값: 처리했는지 여부
  key(key) {
    if (key === 'Escape' || key === 'p' || key === 'P') {
      if (Screen.state === 'play') { pauseGame(); return true; }
      if (Screen.state === 'paused') { resumeGame(); return true; }
      return false;
    }
    if (key === ' ' || key === 'Enter') {
      const buttons = BUTTONS[Screen.state];
      if (!buttons) return Screen.state === 'play';  // 플레이 중 스페이스로 페이지가 스크롤되지 않게
      if (this.buttonsReady()) buttons.find((b) => b.primary).action();
      return true;
    }
    return false;
  },
};

// 도트 버튼: 모서리를 한 칸 깎은 상자 + 아래쪽 그림자 줄
function drawButton(b) {
  const col = CONFIG.COLORS;
  const p = CONFIG.PIXEL;
  const x = Math.round(b.x / p) * p;
  const y = Math.round(b.y / p) * p;
  const { w, h } = b;
  const fill = b.primary ? col.accent : col.button;
  const dark = b.primary ? col.accentDark : col.buttonDark;

  ctx.fillStyle = col.textShadow;                       // 외곽선
  ctx.fillRect(x + p, y, w - 2 * p, h);
  ctx.fillRect(x, y + p, w, h - 2 * p);
  ctx.fillStyle = fill;                                 // 바탕
  ctx.fillRect(x + 2 * p, y + p, w - 4 * p, h - 2 * p);
  ctx.fillRect(x + p, y + 2 * p, w - 2 * p, h - 4 * p);
  ctx.fillStyle = dark;                                 // 아래쪽 입체감
  ctx.fillRect(x + 2 * p, y + h - 3 * p, w - 4 * p, 2 * p);

  ctx.font = `36px ${CONFIG.FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = b.primary ? col.buttonText : col.text;
  ctx.fillText(b.label, x + w / 2, y + h / 2 - p);
}

function drawButtons() {
  const buttons = BUTTONS[Screen.state];
  if (!buttons) return;
  ctx.globalAlpha = UI.buttonsReady() ? 1 : 0.4;
  buttons.forEach(drawButton);
  ctx.globalAlpha = 1;
}

// 결과 화면 (PRD 6-3항). 최고 점수와 공유하기는 8단계에서 추가한다.
function drawResult() {

function drawItems() {
  for (const it of items) {
    Assets.draw(Assets.sprites[it.def.id], it.x - it.w / 2, it.y);
  }
}

function currentPlayerSprite() {
  const s = Assets.sprites;
  if (!player.moving) return s.playerStand;
  const frame = Math.floor(player.walkTime / CONFIG.WALK_FRAME_TIME) % 2;
  return frame === 0 ? s.playerStepL : s.playerStepR;
}

function render() {
  // 캔버스 크기가 바뀌면 설정이 초기화되므로 매 프레임 지정
  ctx.imageSmoothingEnabled = false;

  ctx.drawImage(background, 0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
  const state = Screen.state;

  // 시작 화면: 어둡게 덮은 링 위에 캐릭터만 밝게 보여 준다
  if (state === 'title') {
    dim();
    drawPlayer();
    drawTitle();
    drawButtons();
    return;
  }

  drawPlayer();
  // 결과 화면은 점수를 따로 보여 주므로 HUD·아이템이 제목 뒤에 비치지 않게 생략
  if (state !== 'result') {
    drawItems();   // 받는 순간 캐릭터 앞에 보이도록 아이템을 나중에 그림
    drawHud();
  }

  if (state === 'play') {
    drawPauseButton();
    if (Screen.playTime < CONFIG.START_FLASH_TIME) {
      drawText('START!', CONFIG.WIDTH / 2, 700, 120, CONFIG.COLORS.accent);
    }
  } else if (state === 'countdown') {
    drawCountdown();
  } else {
    dim();
    if (state === 'paused') drawPaused();
    else drawResult();
    drawButtons();
  }
}

function drawPlayer() {
  Assets.drawShadow(player.x, player.y, 24);
  // 무적 시간에는 0.1초 간격으로 깜빡임 (PRD 4-1항)
  const blinkOff = game.invincible > 0 && Math.floor(game.invincible * 10) % 2 === 0;
  if (!blinkOff) {
    Assets.draw(currentPlayerSprite(), player.x - player.w / 2, player.y - player.h);
  }
}

// ============================================================
// 게임 루프: 경과 시간(dt) 기반 (PRD 9항)
// ============================================================
let lastTime = performance.now();

function update(dt) {
  Screen.time += dt;
  if (Screen.state === 'countdown') {
    updatePlayer(dt);
    if (Screen.time >= CONFIG.COUNTDOWN_TIME) setScreen('play');
  } else if (Screen.state === 'play') {
    Screen.playTime += dt;
    updateTimer(dt);
    if (!game.over) {
      updatePlayer(dt);
      updateItems(dt);
    }
  }
  // title·paused·result: 게임 시간이 흐르지 않는다
}

function loop(now) {
  // 탭 전환 등으로 오래 멈췄다 돌아와도 캐릭터가 순간이동하지 않게 dt 상한
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
